# Standard cases use the representative medium/default workloads from the
# established benchmark configuration. Smoke retains every case at 1% rows.

version: 2
name: estimators
providers: [cuml, scikit-learn, umap-learn, hdbscan, cuml.accel, cuml.dask]

profiles:
  standard:
    warmups: 1
    repetitions: 3
    size_scale: 1.0
  smoke:
    warmups: 1
    repetitions: 1
    size_scale: 0.01

cases:
  - estimator: KMeans
    providers: [cuml, scikit-learn, cuml.accel, cuml.dask]
    dataset:
      generator: blobs
      shape:
        rows: 5000000
        features: 128
    operation: fit_predict
    input_selection: [X]
    parameters:
      n_clusters: 5

  - estimator: DBSCAN
    providers: [cuml, scikit-learn, cuml.accel, cuml.dask]
    dataset:
      generator: blobs
      shape:
        rows: 500000
        features: 128
    operation: fit_predict
    input_selection: [X]
    parameters:
      eps: 2.0
      min_samples: 5

  - estimator: SpectralClustering
    providers: [cuml, scikit-learn, cuml.accel]
    dataset:
      generator: blobs
      shape:
        rows: 20000
        features: 64
    operation: fit_predict
    input_selection: [X]
    parameters:
      n_clusters: 5

  - estimator: AgglomerativeClustering
    providers: [cuml, scikit-learn]
    dataset:
      generator: blobs
      shape:
        rows: 50000
        features: 64
    operation: fit_predict
    input_selection: [X]
    parameters:
      n_clusters: 5

  - estimator: EmpiricalCovariance
    providers: [cuml, scikit-learn, cuml.accel]
    dataset:
      generator: matrix
      shape:
        rows: 500000
        features: 128
    operation: fit
    input_selection: [X]
    parameters: {}

  - estimator: LedoitWolf
    providers: [cuml, scikit-learn, cuml.accel]
