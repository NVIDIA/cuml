# Calibrated for: RTX PRO 6000 Blackwell Max-Q Workstation Edition.
# Sizing criteria:
# 1. Representative workload: input size, shape, and data characteristics reflect
#    meaningful usage with default or explicitly justified estimator parameters.
# 2. Meaningful measurement: balanced anchors and ungrouped workloads approach
#    100 ms with repeatable timings; all shapes aim to stay below 10 seconds.
#    Thin/wide timings expose shape-dependent performance, not separate targets.
# 3. Proportionate resource use: input sizes balance measurement duration with
#    GPU and host memory requirements for reliable execution on the target device.
# Fast operations may remain below 100 ms to avoid excessive memory use.
# Assess runtime and variability with docs/benchmarks/score_sizing.py.
#
# Preserve generator distributions; prefer estimator defaults except for bounded
# classifier tree count, explicit projection dimensions, CPU threading, and the
# seeded accel TargetEncoder required for GPU dispatch.

version: 2
name: estimators
providers: [cuml, scikit-learn, umap-learn, hdbscan, cuml.accel, cuml.dask]

profiles:
  standard:
    warmups: 1
    repetitions: 3
    size_scale: 1.0
  smoke:
    warmups: 1
    repetitions: 1
    size_scale: 0.01

cases:
#
# thin/balanced/wide denote relative shapes; balanced does not imply square.
# Balanced cases are sized towards 100ms, thin/wide cases are calibrated to
# keep rows x features approximately equal.

  - estimator: LogisticRegression
    tags: [thin]
    providers: [cuml, scikit-learn, cuml.accel, cuml.dask]
    dataset:
      generator: classification
      shape:
        rows: 96000000
        features: 16
      parameters:
        n_classes: 2
        n_informative: 2
        n_redundant: 2
        n_clusters_per_class: 2
      dtype:
        X: float32
        y: int64
    operation: fit
    input_selection: [X, y]
    parameters: {}

  - estimator: LogisticRegression
    tags: [balanced]
