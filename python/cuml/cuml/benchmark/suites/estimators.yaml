# Single-GPU estimator benchmarks across representative input shapes and
# parameter settings, with explicit provider coverage and standard/smoke profiles.

version: 2
name: estimators
providers: [cuml, scikit-learn, umap-learn, hdbscan, cuml.accel, cuml.dask]

profiles:
  standard:
    warmups: 1
    repetitions: 3
    size_scale: 1.0
  smoke:
    warmups: 1
    repetitions: 1
    size_scale: 0.01

cases:
#
# thin/balanced/wide denote relative shapes; balanced does not imply square.

  - estimator: LogisticRegression
    tags: [thin]
    providers: [cuml, scikit-learn, cuml.accel, cuml.dask]
    dataset:
      generator: classification
      shape:
        rows: 75600000
        features: 16
      parameters:
        n_classes: 2
        n_informative: 2
        n_redundant: 2
        n_clusters_per_class: 2
      dtype:
        X: float32
        y: int64
    operation: fit
    input_selection: [X, y]
    parameters: {}

  - estimator: LogisticRegression
