    providers: [cuml, scikit-learn, cuml.accel, cuml.dask]
    dataset:
      generator: classification
      shape:
        rows: 75600000
        features: 16
      parameters:
        n_classes: 2
        n_informative: 2
        n_redundant: 2
        n_clusters_per_class: 2
      dtype:
        X: float32
        y: int64
    operation: fit
    input_selection: [X, y]
    parameters: {}

