# Single-GPU estimator benchmarks across representative input shapes and
# parameter settings, with explicit provider coverage and standard/smoke profiles.

version: 2
name: estimators
providers: [cuml, scikit-learn, umap-learn, hdbscan, cuml.accel, cuml.dask]

profiles:
  standard:
    warmups: 1
    repetitions: 3
    size_scale: 1.0
  smoke:
    warmups: 1
    repetitions: 1
    size_scale: 0.01

