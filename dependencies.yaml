# Dependency list for https://github.com/rapidsai/dependency-file-generator
files:
  all:
    output: conda
    matrix:
      cuda: ["12.9", "13.3"]
      arch: [x86_64, aarch64]
    includes:
      - common_build
      - cuda
      - cuda_version
      - depends_on_cudf
      - depends_on_cuda_python
      - depends_on_cupy
      - depends_on_rapids_dask_dependency
      - depends_on_dask_cuda
      - depends_on_dask_cudf
      - depends_on_libcuvs
      - depends_on_libnvforest
      - depends_on_libraft
      - depends_on_librmm
      - depends_on_numba_cuda
      - depends_on_nvforest
      - depends_on_pylibraft
      - depends_on_raft_dask
      - depends_on_rapids_logger
      - depends_on_rmm
      - develop
      - docs
      - py_build_cuml
      - py_run_cuml
      - py_version
      - rapids_build_backend
      - test_python
      - test_python_dask
      - test_python_xgboost
  devcontainers:
    output: none
    includes:
      # "devcontainers" includes everything in "all", excluding test_python_xgboost
      # The libxgboost package depends on librmm but we do not want to have a
      # package depending on librmm in devcontainers since it should be built
      # from source.
      - common_build
      - cuda
      - cuda_version
      - depends_on_cudf
      - depends_on_cuda_python
      - depends_on_cupy
      - depends_on_rapids_dask_dependency
      - depends_on_dask_cuda
      - depends_on_dask_cudf
      - depends_on_libcuvs
      - depends_on_libnvforest
      - depends_on_libraft
      - depends_on_librmm
      - depends_on_numba_cuda
      - depends_on_nvforest
      - depends_on_pylibraft
      - depends_on_raft_dask
      - depends_on_rapids_logger
      - depends_on_rmm
      - docs
      - py_build_cuml
      - py_run_cuml
      - py_version
      - rapids_build_backend
      - test_python
      - test_python_dask
  cpp_all:
    output: conda
    matrix:
      cuda: ["12.9", "13.3"]
      arch: [x86_64]
    includes:
      - common_build
      - cuda
      - cuda_version
      - depends_on_libcuvs
      - depends_on_libnvforest
      - depends_on_libraft_headers
      - depends_on_librmm
  checks:
    output: none
    includes:
      - checks
      - py_version
  clang_tidy:
    output: conda
    matrix:
      cuda: ["12.9", "13.3"]
      arch: [x86_64]
    includes:
      - clang_tidy
      - common_build
      - cuda
      - cuda_version
      - depends_on_libcuvs
      - depends_on_libnvforest
      - depends_on_libraft_headers
      - depends_on_librmm
  docs:
    output: none
    includes:
      - cuda_version
      - docs
      - py_version
      - depends_on_cuml
      - depends_on_libcuml
      - depends_on_libnvforest
      - depends_on_rapids_dask_dependency
      - depends_on_dask_cuda
      - depends_on_dask_cudf
      - depends_on_raft_dask
  test_cpp:
    output: none
    includes:
      - cuda_version
      - depends_on_libcuml
      - depends_on_libnvforest
      - test_libcuml
      - test_cpp
  test_integration_bertopic:
    output: none
    includes:
      - test_bertopic
  test_python:
    output: none
    includes:
      - cuda_version
      - depends_on_cuml
      - depends_on_cupy
      - depends_on_libcuml
      - depends_on_nvforest
      - py_version
      - test_python
      - test_python_xgboost
  test_python_accel_sklearn:
    output: none
    includes:
      - cuda_version
      - depends_on_cuml
      - depends_on_cupy
      - depends_on_libcuml
      - depends_on_nvforest
      - py_version
      - test_python
      - test_python_accel_sklearn
  test_python_dask:
    output: none
    includes:
      - cuda_version
      - depends_on_cuml
      - depends_on_cupy
      - depends_on_libcuml
      - depends_on_libnvforest
      - py_version
      - test_python
      - test_python_xgboost
      - test_python_dask
      - depends_on_rapids_dask_dependency
      - depends_on_dask_cudf
      - depends_on_raft_dask
      - depends_on_dask_cuda
  test_notebooks:
    output: none
    includes:
      - cuda_version
      - depends_on_cuml
      - depends_on_cupy
      - depends_on_rapids_dask_dependency
      - depends_on_dask_cuda
      - depends_on_dask_cudf
      - depends_on_numba_cuda
      - depends_on_nvforest
      - depends_on_pylibraft
      - depends_on_raft_dask
      - depends_on_rmm
      - py_run_cuml
      - py_version
      - test_notebooks
      - test_python_xgboost
  py_build_cuml:
    output: pyproject
    pyproject_dir: python/cuml
    extras:
      table: build-system
    includes:
      - rapids_build_backend
  py_rapids_build_cuml:
    output: pyproject
    pyproject_dir: python/cuml
    extras:
      table: tool.rapids-build-backend
      key: requires
    includes:
      - common_build
      - depends_on_cuda_python
      - depends_on_libcuml
      - depends_on_libnvforest
      - depends_on_libraft
      - depends_on_librmm
      - depends_on_nvforest
      - depends_on_pylibraft
      - depends_on_rmm
      - py_build_cuml
  py_run_cuml:
    output: pyproject
    pyproject_dir: python/cuml
    extras:
      table: project
    includes:
      - cuda_wheels
      - depends_on_cuda_python
      - depends_on_cudf
      - depends_on_cupy
      - depends_on_libcuml
      - depends_on_numba_cuda
      - depends_on_nvforest
      - depends_on_pylibraft
      - depends_on_rmm
      - py_run_cuml
  py_test_cuml:
    output: pyproject
    pyproject_dir: python/cuml
    extras:
      table: project.optional-dependencies
      key: test
    includes:
      - test_python
      - test_python_xgboost
  py_dask_cuml:
    output: pyproject
    pyproject_dir: python/cuml
    extras:
      table: project.optional-dependencies
      key: dask
    includes:
      - depends_on_rapids_dask_dependency
      - depends_on_dask_cudf
      - depends_on_raft_dask
  py_test_dask_cuml:
    output: pyproject
    pyproject_dir: python/cuml
    extras:
      table: project.optional-dependencies
      key: test-dask
    includes:
      - depends_on_dask_cuda
      - test_python_dask
  py_build_libcuml:
    output: pyproject
    pyproject_dir: python/libcuml
    extras:
      table: build-system
    includes:
      - rapids_build_backend
  py_rapids_build_libcuml:
    output: pyproject
    pyproject_dir: python/libcuml
    extras:
      table: tool.rapids-build-backend
      key: requires
    includes:
      - common_build
      - depends_on_libcuvs
      - depends_on_libnvforest
      - depends_on_libraft
      - depends_on_librmm
      - depends_on_rapids_logger
  py_run_libcuml:
    output: pyproject
    pyproject_dir: python/libcuml
    extras:
      table: project
    includes:
      - cuda_wheels
      - depends_on_libcuvs
      - depends_on_libnvforest
      - depends_on_libraft
      - depends_on_librmm
      - depends_on_rapids_logger
channels:
  - rapidsai-nightly
  - rapidsai
  - conda-forge
dependencies:
  rapids_build_backend:
    common:
      - output_types: [conda, requirements, pyproject]
        packages:
          - rapids-build-backend>=0.4.0,<0.5.0
      - output_types: [conda]
        packages:
          - scikit-build-core>=0.11.0
      - output_types: [requirements, pyproject]
        packages:
          - scikit-build-core[pyproject]>=0.11.0
  checks:
    common:
      - output_types: [conda, requirements]
        packages:
          - pre-commit
  clang_tidy:
    common:
      - output_types: [conda, requirements]
        packages:
          - clang==20.1.8
          - clang-tools==20.1.8
          - llvm-openmp==20.1.8
          - ninja
          - tomli
  common_build:
    common:
      - output_types: [conda, requirements, pyproject]
        packages:
          - &cmake_ver cmake>=4.0
          - ninja
      - output_types: conda
        packages:
          - c-compiler
          - cuda-nvcc
          - cxx-compiler
    specific:
      - output_types: conda
        matrices:
          - matrix:
              arch: x86_64
            packages:
              - gcc_linux-64=14.*
              - sysroot_linux-64==2.28
          - matrix:
              arch: aarch64
            packages:
              - gcc_linux-aarch64=14.*
              - sysroot_linux-aarch64==2.28
  develop:
    common:
      - output_types: [conda, requirements]
        packages:
          - pre-commit
      - output_types: conda
        packages:
          - ccache
  py_build_cuml:
    common:
      - output_types: [conda, requirements, pyproject]
        packages:
          # skipping Cython 3.2.7 because of https://github.com/cython/cython/issues/7781
          - &cython cython>=3.2.2,!=3.2.7
          - &treelite treelite>=4.7.0,<5.0.0
  py_run_cuml:
    common:
      - output_types: [conda, requirements, pyproject]
        packages:
          - joblib>=0.11
          - numba>=0.60.0,<0.65.0
          - &numpy numpy>=2.0,<3.0
          - scipy>=1.14.0
          - packaging
          - rich
          - &scikit_learn scikit-learn>=1.6
          - *treelite
  # 'cuda_version' intentionally does not contain fallback entries... we want
  # a loud error if an unsupported 'cuda' value is passed
  cuda_version:
    specific:
      - output_types: conda
        matrices:
          - matrix:
              cuda: "12.2"
            packages:
              - cuda-version=12.2
          - matrix:
              cuda: "12.5"
            packages:
              - cuda-version=12.5
          - matrix:
              cuda: "12.8"
            packages:
              - cuda-version=12.8
          - matrix:
              cuda: "12.9"
            packages:
              - cuda-version=12.9
          - matrix:
              cuda: "13.0"
            packages:
              - cuda-version=13.0
          - matrix:
              cuda: "13.1"
            packages:
              - cuda-version=13.1
          - matrix:
              cuda: "13.2"
            packages:
              - cuda-version=13.2
          - matrix:
              cuda: "13.3"
            packages:
              - cuda-version=13.3
      - output_types: requirements
        matrices:
          # if use_cuda_wheels=false is provided, do not add dependencies on any CUDA wheels
          # (e.g. for DLFW and pip devcontainers)
          - matrix:
              use_cuda_wheels: "false"
            packages:
          - matrix:
              arch: aarch64
              cuda: "12.2"
              use_cuda_wheels: "true"
            packages:
              # some components (like nvidia-cublas-cu12 and nvidia-cuda-nvcc-cu12) didn't have
              # aarch64 wheels until CTK 12.3, so allow a slightly looser bound here
              - cuda-toolkit>=12.2,<12.4
          - matrix:
              cuda: "12.2"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==12.2.*
          - matrix:
              cuda: "12.5"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==12.5.*
          - matrix:
              cuda: "12.8"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==12.8.*
          - matrix:
              cuda: "12.9"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==12.9.*
          - matrix:
              cuda: "13.0"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==13.0.*
          - matrix:
              cuda: "13.1"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==13.1.*
          - matrix:
              cuda: "13.2"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==13.2.*
          - matrix:
              cuda: "13.3"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit==13.3.*
  cuda:
    common:
      - output_types: [conda]
        packages:
          - cuda-cudart-dev
          - cuda-profiler-api
          - libcublas-dev
          - libcufft-dev
          - libcurand-dev
          - libcusolver-dev
          - libcusparse-dev
  cuda_wheels:
    specific:
      # cuML needs 'nvJitLink>={whatever-cuml-was-built-against}' at runtime, and mixing
      # old-CTK with new-nvJitLink is supported, so maintain 1 entry here per CUDA major.minor
      # cuML is built against.
      #
      # nvJitLink has historically roughly followed the CTK's minor versioning scheme,
      # but check at https://docs.nvidia.com/cuda/cuda-toolkit-release-notes/index.html
      - output_types: [requirements, pyproject]
        matrices:
          # if use_cuda_wheels=false is provided, do not add dependencies on any CUDA wheels
          # (e.g. for DLFW and pip devcontainers)
          - matrix:
              use_cuda_wheels: "false"
            packages:
          # We always want nvJitLink >= whatever minor version was available in the build environment
          # nvJitLink tends to follow the CTK's minor versions, but check at https://docs.nvidia.com/cuda/cuda-toolkit-release-notes/index.html
          #
          # ref: https://github.com/NVIDIA/cudf/pull/20873
          - matrix:
              cuda: "12.9"
              use_cuda_wheels: "true"
            packages:
              - cuda-toolkit[cublas,cufft,curand,cusolver,cusparse]==12.*
              - nvidia-nvjitlink-cu12>=12.9,<13
          - matrix:
              cuda: "13.*"
              use_cuda_wheels: "true"
            packages:
              - &ctk_cu13 cuda-toolkit[cublas,cufft,curand,cusolver,cusparse]==13.*
              - &nvjitlink_cu13 nvidia-nvjitlink>=13.3,<14
          # if no matching matrix selectors passed, list the CUDA 13 requirement
          # (just as a source of documentation, as this populates pyproject.toml in source control)
          - matrix:
            packages:
              - *ctk_cu13
              - *nvjitlink_cu13
  docs:
    common:
      - output_types: [conda, requirements]
        packages:
          - graphviz
          - ipython
          - ipykernel
          - nbsphinx
          - numpydoc
          - &onnxruntime onnxruntime
          - recommonmark
          - *scikit_learn
          - &skl2onnx skl2onnx
          - sphinx
          - sphinx-copybutton
          - sphinx-design
          - sphinx-markdown-tables
      - output_types: conda
        packages:
          - doxygen=1.9.1
          - matplotlib-base
          - pip:
              - nvidia-sphinx-theme
      - output_types: requirements
        packages:
          - matplotlib
          - nvidia-sphinx-theme
  py_version:
    specific:
      - output_types: conda
        matrices:
          - matrix:
              py: "3.11"
            packages:
              - python=3.11
          - matrix:
              py: "3.12"
            packages:
              - python=3.12
          - matrix:
              py: "3.13"
            packages:
              - python=3.13
          - matrix:
              py: "3.14"
            packages:
              - python=3.14
          - matrix:
            packages:
              - python>=3.11
  test_bertopic:
    common:
      - output_types: requirements
        packages:
          - bertopic>=0.17.4
    specific:
      # The 'pytorch.org' indices referenced in --extra-index-url below host CPU-only variants too,
      # so requirements like '>=' are not safe.
      #
      # Using '==' and a version with the CUDA specifier like '+cu132' is the most reliable way to ensure
      # the packages we want are pulled (at the expense of needing to maintain this list).
      - output_types: requirements
        matrices:
          - matrix:
              cuda: "12.*"
            packages:
              - --extra-index-url=https://download.pytorch.org/whl/cu129
              - torch==2.10.0+cu129
          - matrix:
              cuda: "13.*"
            packages:
              - --extra-index-url=https://download.pytorch.org/whl/cu132
              - torch==2.12.1+cu132
  test_libcuml:
    common:
      - output_types: conda
        packages:
          - libcuml-tests==26.10.*,>=0.0.0a0
  test_cpp:
    common:
      - output_types: conda
        packages:
          - *cmake_ver
  test_python:
    specific:
      - output_types: [conda, requirements, pyproject]
        matrices:
          # Package versions to use for the "oldest-dep" CI run
          - matrix: {dependencies: "oldest"}
            packages:
              - scikit-learn==1.6.0
              - umap-learn==0.5.7
              - hdbscan==0.8.39
              - numpy==2.0
          - matrix: {dependencies: "nightly"}
            packages:
              # Pre-release specifier tells pip to accept dev/alpha/beta versions
              - scikit-learn>=1.6.0a0
          - matrix:
            packages:
              - *scikit_learn
              - hdbscan>=0.8.39
              - ipython>=7.32.0
      # ipython for "oldest" is split: conda uses 8.x (7.x has no Python 3.11+ packages),
      # pip uses 7.34.0 from PyPI (which supports Python 3.11+)
      - output_types: [conda]
        matrices:
          - matrix: {dependencies: "oldest"}
            packages:
              - ipython=8
          - matrix:
            packages:
      - output_types: [requirements, pyproject]
        matrices:
          - matrix: {dependencies: "oldest"}
            packages:
              - ipython==7.34.0
          - matrix:
            packages:
      - output_types: requirements
        matrices:
          - matrix: {dependencies: "nightly"}
            packages:
              - --extra-index-url=https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
          - matrix:  # fallback for non-nightly dependencies
            packages:
      # TODO: we're seeing test failures with openblas > 0.3.30 on aarch64. For
      # now we pin openblas in tests on that architecture.
      - output_types: [conda]
        matrices:
          - matrix:
              arch: aarch64
            packages:
              - libopenblas<=0.3.30
          - matrix:
            packages:
      - output_types: [conda, requirements, pyproject]
        matrices:
          - matrix:
              dependencies: "oldest"
              cuda: "12.*"
            packages:
              - cuda-bindings==12.9.2
          - matrix:
              dependencies: "oldest"
              cuda: "13.*"
            packages:
              - cuda-bindings==13.0.1
          - matrix:
            packages:
    common:
      - output_types: [conda, requirements, pyproject]
        packages:
          - certifi
          - *cython
          - hypothesis>=6.0,<7
          - msgspec
          - nltk
          # upstream sklearn docstring tests require numpydoc<1.9
          - numpydoc<1.9
          # 'nvidia-ml-py' provides the 'pynvml' module
          - nvidia-ml-py>=12
          - *onnxruntime
          - *skl2onnx
          - pytest
          - pytest-benchmark
          - pytest-cov
          - pytest-xdist
          - pyyaml
          - seaborn
          - statsmodels
          - umap-learn>=0.5.7,<0.5.13
          - pynndescent
          - lightgbm
          - shap
      - output_types: conda
        packages:
          - cuvs==26.10.*,>=0.0.0a0
  test_python_accel_sklearn:
    # Exact pin the sklearn versions used for running upstream sklearn tests
    # in cuml.accel. We exact pin here since our xfail list is tightly coupled
    # to the version of sklearn we're running. The code should run with a much
    # more flexible set of sklearn dependencies, this pinning is just for CI.
    specific:
      - output_types: [conda, requirements, pyproject]
        matrices:
          - matrix: {dependencies: "latest"}
            packages:
              - scikit-learn==1.9.0
          - matrix: {dependencies: "intermediate"}
            packages:
              - scikit-learn==1.8.0
          - matrix: {dependencies: "oldest"}
            packages:
              - scikit-learn==1.6.0
  test_python_dask:
    common:
      - output_types: [conda, requirements, pyproject]
        packages:
          - dask-ml>=2024
  test_python_xgboost:
    specific:
      - output_types: [conda]
        matrices:
          - matrix:
              py: "3.11"
            packages: []
          - matrix:
            packages:
              - xgboost>=3.3.0
      - output_types: [requirements, pyproject]
        matrices:
          - matrix:
              py: "3.11"
            packages: []
          - matrix:
              cuda: "12.*"
              cuda_suffixed: "true"
            packages:
              - xgboost-cu12>=2.1.0
          - matrix:
              arch: aarch64
              cuda: "13.*"
              cuda_suffixed: "true"
            packages:
              # TODO: always install xgboost-cu13 once there are xgboost-cu13 aarch64 wheels
              #
              # xgboost-cu13 originally shipped without aarch64 wheels
              # Using the unsuffixed name pulls in CUDA 12 packages for some versions and may
              # at some point in the future pull in CUDA 13 packages.
              #
              # ref: https://github.com/NVIDIA/cuml/pull/7550#issuecomment-3603279934
              - &xgboost_unsuffixed xgboost>=2.1.0
          - matrix:
              arch: x86_64
              cuda: "13.*"
              cuda_suffixed: "true"
            packages:
              - xgboost-cu13>=2.1.0
          # this unsuffixed dependency is useful in environments where xgboost is built from source
          # (like RAPIDS DLFW builds)
          - matrix:
            packages:
              - *xgboost_unsuffixed
  test_notebooks:
    common:
      - output_types: [conda, requirements]
        packages:
          - dask-ml==2025.1.0
          - jupyter
          - *numpy
          - pandas
          - *scikit_learn
          - seaborn
      - output_types: conda
        packages:
          - matplotlib-base
      - output_types: requirements
        packages:
          - matplotlib
  depends_on_cuda_python:
    specific:
      - output_types: [conda, requirements, pyproject]
        matrices:
          - matrix:
              cuda: "12.*"
            packages:
              - cuda-bindings>=12.9.2,<13.0
          # fallback to CUDA 13 versions if 'cuda' is '13.*' or not provided
          - matrix:
            packages:
              - cuda-bindings>=13.0.1,<14.0
  depends_on_cudf:
    common:
      - output_types: conda
        packages:
          - &cudf_unsuffixed cudf==26.10.*,>=0.0.0a0
      - output_types: requirements
        packages:
          # pip recognizes the index as a global option for the requirements.txt file
          - --extra-index-url=https://pypi.anaconda.org/rapidsai-wheels-nightly/simple
    specific:
      - output_types: [requirements, pyproject]
        matrices:
          - matrix:
              cuda: "12.*"
              cuda_suffixed: "true"
            packages:
              - cudf-cu12==26.10.*,>=0.0.0a0
          - matrix:
              cuda: "13.*"
              cuda_suffixed: "true"
            packages:
              - cudf-cu13==26.10.*,>=0.0.0a0
          - matrix:
            packages:
