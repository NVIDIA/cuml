name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@main
  changed-files:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/changed-files.yaml@main
    with:
      files_yaml: |
        build_docs:
          - '**'
          - '!**/*/agents.md'
          - '!.coderabbit.yaml'
          - '!.devcontainer/**'
          - '!.git-blame-ignore-revs'
          - '!.github/CODEOWNERS'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/labeler.yml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/scripts/**'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/labeler.yml'
          - '!.github/workflows/new-issues-to-triage-projects.yml'
          - '!.github/workflows/pr_assign_author.yml'
          - '!.github/workflows/pr_issue_status_automation.yml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.pre-commit-config.yaml'
          - '!.yamllint.yaml'
          - '!SECURITY.md'
          - '!ci/build_wheel*.sh'
          - '!ci/check_style.sh'
          - '!ci/release/update-version.sh'
          - '!ci/test_notebooks.sh'
          - '!ci/test_python*.sh'
          - '!ci/test_wheel*.sh'
          - '!codecov.yml'
        test_cpp:
          - '**'
          - '!**/*/agents.md'
          - '!.coderabbit.yaml'
          - '!.devcontainer/**'
          - '!.git-blame-ignore-revs'
          - '!.github/CODEOWNERS'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/labeler.yml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/scripts/**'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/labeler.yml'
          - '!.github/workflows/new-issues-to-triage-projects.yml'
          - '!.github/workflows/pr_assign_author.yml'
          - '!.github/workflows/pr_issue_status_automation.yml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.pre-commit-config.yaml'
          - '!.yamllint.yaml'
          - '!BUILD.md'
          - '!CONTRIBUTING.md'
          - '!README.md'
          - '!SECURITY.md'
          - '!ci/build_docs.sh'
          - '!ci/build_python.sh'
          - '!ci/build_wheel*.sh'
          - '!ci/check_style.sh'
          - '!ci/notebooks/**'
          - '!ci/release/update-version.sh'
          - '!ci/test_notebooks.sh'
          - '!ci/test_python*.sh'
          - '!ci/test_wheel*.sh'
          - '!docs/**'
          - '!img/**'
          - '!notebooks/**'
          - '!python/**'
          - '!thirdparty/LICENSES/**'
        test_notebooks:
          - '**'
          - '!**/*/agents.md'
          - '!.coderabbit.yaml'
          - '!.devcontainer/**'
          - '!.git-blame-ignore-revs'
          - '!.github/CODEOWNERS'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/labeler.yml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/scripts/**'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/labeler.yml'
          - '!.github/workflows/new-issues-to-triage-projects.yml'
          - '!.github/workflows/pr_assign_author.yml'
          - '!.github/workflows/pr_issue_status_automation.yml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.pre-commit-config.yaml'
          - '!.yamllint.yaml'
          - '!BUILD.md'
          - '!CONTRIBUTING.md'
          - '!README.md'
          - '!SECURITY.md'
          - '!ci/build_wheel*.sh'
          - '!ci/check_style.sh'
          - '!ci/release/update-version.sh'
          - '!ci/test_wheel*.sh'
          - '!ci/validate_wheel.sh'
          - '!cpp/.clang-format'
          - '!cpp/.clang-tidy'
          - '!cpp/Doxyfile.in'
          - '!cpp/README.md'
          - '!cpp/header.html'
          - '!thirdparty/LICENSES/**'
        test_python_conda:
          - '**'
          - '!**/*/agents.md'
          - '!.coderabbit.yaml'
          - '!.devcontainer/**'
          - '!.git-blame-ignore-revs'
          - '!.github/CODEOWNERS'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/labeler.yml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/scripts/**'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/labeler.yml'
          - '!.github/workflows/new-issues-to-triage-projects.yml'
          - '!.github/workflows/pr_assign_author.yml'
          - '!.github/workflows/pr_issue_status_automation.yml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.pre-commit-config.yaml'
          - '!.yamllint.yaml'
          - '!BUILD.md'
          - '!CONTRIBUTING.md'
          - '!README.md'
          - '!SECURITY.md'
          - '!ci/build_wheel*.sh'
          - '!ci/check_style.sh'
          - '!ci/release/update-version.sh'
          - '!ci/run_clang_tidy.sh'
          - '!ci/run_ctests.sh'
          - '!ci/test_wheel*.sh'
          - '!ci/validate_wheel.sh'
          - '!cpp/.clang-format'
          - '!cpp/.clang-tidy'
          - '!cpp/Doxyfile.in'
          - '!cpp/README.md'
          - '!cpp/header.html'
          - '!docs/**'
          - '!img/**'
          - '!notebooks/**'
          - '!thirdparty/LICENSES/**'
        test_python_wheels:
          - '**'
          - '!**/*/agents.md'
          - '!.coderabbit.yaml'
          - '!.devcontainer/**'
          - '!.git-blame-ignore-revs'
          - '!.github/CODEOWNERS'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/labeler.yml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/scripts/**'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/labeler.yml'
          - '!.github/workflows/new-issues-to-triage-projects.yml'
          - '!.github/workflows/pr_assign_author.yml'
          - '!.github/workflows/pr_issue_status_automation.yml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.pre-commit-config.yaml'
          - '!.yamllint.yaml'
          - '!BUILD.md'
          - '!CONTRIBUTING.md'
          - '!README.md'
          - '!SECURITY.md'
          - '!ci/build_cpp.sh'
          - '!ci/build_python.sh'
          - '!ci/check_style.sh'
          - '!ci/notebooks/**'
          - '!ci/release/update-version.sh'
          - '!ci/run_clang_tidy.sh'
          - '!ci/run_tests.sh'
          - '!ci/test_cpp.sh'
          - '!ci/test_notebooks.sh'
          - '!ci/test_python*.sh'
          - '!conda/**'
          - '!cpp/.clang-format'
          - '!cpp/.clang-tidy'
          - '!cpp/Doxyfile.in'
          - '!cpp/README.md'
          - '!cpp/header.html'
          - '!docs/**'
          - '!img/**'
          - '!notebooks/**'
          - '!thirdparty/LICENSES/**'
  wheel-build-libcuml:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      node_type: cpu16
      script: ci/build_wheel_libcuml.sh
      # build for every combination of arch and CUDA version, but only for the latest Python
      matrix_filter: 'group_by([.ARCH, (.CUDA_VER|split(".")|map(tonumber)|.[0])]) | map(max_by(.PY_VER|split(".")|map(tonumber)))'
      package-name: libcuml
      package-type: cpp
      matrix_type: pull-request
  wheel-build-cuml:
    needs: [build-details, wheel-build-libcuml]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu8
      script: ci/build_wheel_cuml.sh
      package-name: cuml
      package-type: python
      # Build a wheel for each CUDA x ARCH x minimum supported Python version
      matrix_filter: group_by({CUDA_VER, ARCH}) | map(min_by(.PY_VER | split(".") | map(tonumber)))
      matrix_type: pull-request
  wheel-tests-cuml:
    needs: [wheel-build-cuml, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_wheels
    with:
      build_type: pull-request
      script: ci/test_wheel.sh
      matrix_type: wsl-pr
  wheel-tests-cuml-dask:
    needs: [wheel-build-cuml, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_wheels
    with:
      build_type: pull-request
      script: ci/test_wheel_dask.sh
      matrix_type: wsl-pr
      # NCCL_CUMEM_ENABLE=0 on WSL needs more than Docker's default 64 MB /dev/shm.
      container-options: "--shm-size=1g"
