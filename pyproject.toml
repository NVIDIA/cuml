[tool.codespell]
# note: pre-commit passes explicit lists of files here, which this skip file list doesn't override -
# this is only to allow you to run codespell interactively
skip = "./.git,./.github,./cpp/build,.*egg-info.*,./.mypy_cache,.*_skbuild,CHANGELOG.md,_stop_words.py,,*stemmer.*"
# ignore short words, and typename parameters like OffsetT
ignore-regex = "\\b(.{1,4}|[A-Z]\\w*T)\\b"
ignore-words-list = "inout,numer,startd,couldn,referr,thirdparty,rocess"
# use the 'clear' dictionary for unambiguous spelling mistakes
builtin = "clear"
# disable warnings about binary files and wrong encoding
quiet-level = 3

[tool.cython-lint]
max-line-length = 105

[tool.rstcheck]
report_level = "INFO"

# rstcheck only knows about directives coming from 'docutils', not
# those supplied by extensions. This list of ignores suppresses errors
# like "no directive entry".
ignore_directives = [
    # rstcheck does not understand 'sphinx.ext.auto*' directives
    "autoclass",
    "autofunction",
    "automodule",
    "autosummary",
    # rstcheck does not understand 'sphinx-design' directives
    "dropdown",
    "grid",
    "grid-item-card",
    # rstcheck does not understand 'doxygen' directives
    "doxygenenum",
    "doxygenfunction",
    "doxygengroup",
    "doxygennamespace",
    "doxygenstruct",
    "doxygentypedef"
]

ignore_messages = '''(?x)(
    # ignore links that look "unused" because they're there to provide stable anchors in hyperlinks
    Hyperlink\ target\ .*\ is\ not\ referenced
)
'''

[tool.run-clang-tidy]
ignore = "[.]cu$|_deps|examples/kmeans/"

[tool.ruff]
line-length = 79
extend-include = ["*.pyx", "*.pxd"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
extend-ignore = [
    "F811",
]

[tool.ruff.lint.per-file-ignores]
"*.pyx" = ["E999", "E225", "E226", "E227"]
"*.pxd" = ["E999", "E225", "E226", "E227"]
"__init__.py" = ["F401"]
"cpp/examples/**" = ["F401"]

[tool.pytest.ini_options]
addopts = "-p cuml_pytest --tb=native --import-mode=append -r fExX"
pythonpath = [
  "ci",
]
testpaths = [
  "python/cuml/tests",
]
markers = [
  "unit: Quickest tests focused on accuracy and correctness",
  "quality: More intense tests than unit with increased runtimes",
  "stress: Longest running tests focused on stressing hardware compute resources",
  "mg: Multi-GPU tests",
  "memleak: Test that checks for memory leaks",
  "ucx: Run _only_ Dask UCXX tests",
]
filterwarnings = [
  "error::FutureWarning",
  "error::DeprecationWarning",
  "error:::cudf",
  "ignore:[^.]*ABCs[^.]*:DeprecationWarning:patsy[.*]",
  "ignore:(.*)alias(.*):DeprecationWarning:hdbscan[.*]",
  # From sklearn
  "ignore:A column-vector y was passed:sklearn.exceptions.DataConversionWarning",
  "ignore::sklearn.exceptions.SkipTestWarning",
  # sklearn 1.6 renamed force_all_finite to ensure_all_finite
  "ignore:'force_all_finite' was renamed to 'ensure_all_finite'.*:FutureWarning",
  # From dask-glm
  "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
  "ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning",
  "ignore:`rcond` parameter will change to the default:FutureWarning",
  "ignore:Dask configuration key 'fuse_ave_width':FutureWarning",
  # From dask/distributed
  "ignore:Dask annotations .* detected:UserWarning",
  "ignore:Sending large graph of size:UserWarning",
  # From hdbscan
  "ignore:Conversion of an array with ndim > 0:DeprecationWarning",
  # From umap-learn
  "ignore:Tensorflow not installed.*:ImportWarning:umap",
  # From sklearn estimator checks
  "ignore:Estimator .* does not inherit from.*:UserWarning",
  # TargetEncoder combination mode deprecation (will change to 2D output in 26.04)
  "ignore:TargetEncoder currently returns 1D output:FutureWarning",
  # From numba - GPU under-utilization warnings in tests with small data
  "ignore::numba.core.errors.NumbaPerformanceWarning",
  # numba-cuda makes use of deprecated cuda.core.experimental apis
  "ignore:The cuda.core.experimental namespace is deprecated:DeprecationWarning",
  # Allow informational benchmark warnings (pytest-benchmark plugin)
  "default::pytest_benchmark.logger.PytestBenchmarkWarning",
  # sklearn's parametrize_with_checks passes a generator to parametrize
  "ignore:Passing a non-Collection iterable:pytest.PytestRemovedIn10Warning",
]
