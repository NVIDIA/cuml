[tool.codespell]
# note: pre-commit passes explicit lists of files here, which this skip file list doesn't override -
# this is only to allow you to run codespell interactively
skip = "./.git,./.github,./cpp/build,.*egg-info.*,./.mypy_cache,.*_skbuild,CHANGELOG.md,_stop_words.py,,*stemmer.*"
# ignore short words, and typename parameters like OffsetT
ignore-regex = "\\b(.{1,4}|[A-Z]\\w*T)\\b"
ignore-words-list = "inout,numer,startd,couldn,referr,thirdparty,rocess"
# use the 'clear' dictionary for unambiguous spelling mistakes
builtin = "clear"
# disable warnings about binary files and wrong encoding
quiet-level = 3

[tool.cython-lint]
max-line-length = 105

[tool.rstcheck]
report_level = "INFO"

# rstcheck only knows about directives coming from 'docutils', not
# those supplied by extensions. This list of ignores suppresses errors
# like "no directive entry".
ignore_directives = [
    # rstcheck does not understand 'sphinx.ext.auto*' directives
    "autoclass",
    "autofunction",
    "automodule",
    "autosummary",
    # rstcheck does not understand 'sphinx-design' directives
    "dropdown",
    # rstcheck does not understand 'doxygen' directives
    "doxygenenum",
    "doxygenfunction",
    "doxygengroup",
    "doxygennamespace",
    "doxygenstruct",
    "doxygentypedef"
]

ignore_messages = '''(?x)(
    # ignore links that look "unused" because they're there to provide stable anchors in hyperlinks
    Hyperlink\ target\ .*\ is\ not\ referenced
)
'''

[tool.run-clang-tidy]
ignore = "[.]cu$|_deps|examples/kmeans/"

[tool.ruff]
line-length = 79
extend-include = ["*.pyx", "*.pxd"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
extend-ignore = [
    "F811",
]

[tool.ruff.lint.per-file-ignores]
"*.pyx" = ["E999", "E225", "E226", "E227"]
"*.pxd" = ["E999", "E225", "E226", "E227"]
"__init__.py" = ["F401"]
"cpp/examples/**" = ["F401"]
